<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Transaksi Rental Tab</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="form-container">
  <h2>Booking Tablet</h2>

  <label for="paket" style="font-size: 14px; color: #475569; display: block; margin-bottom: 5px;">Pilih Tipe Tablet:</label>
  <select id="paket">
    <option value="10000">Samsung Tab A Series (Office) - Rp 10.000 /jam</option>
    <option value="20000">Samsung Tab S FE Series (Gaming) - Rp 20.000 /jam</option>
    <option value="25000">Samsung Tab S Ultra (Editing/Pro) - Rp 25.000 /jam</option>
  </select>

  <label for="jam" style="font-size: 14px; color: #475569; display: block; margin-bottom: 5px; margin-top: 10px;">Durasi Sewa:</label>
  <input type="number" id="jam" placeholder="Masukkan Jumlah Jam" min="1">

  <div class="checkbox-group">
    <label class="checkbox-label">
      <input type="checkbox" id="member">
      <span>Membership (Diskon 20%)</span>
    </label>

    <label class="checkbox-label">
      <input type="checkbox" id="booking">
      <span>Booking Online (+Rp 2.000)</span>
    </label>

    <label class="checkbox-label">
      <input type="checkbox" id="delivery">
      <span>Antar Jemput / Delivery (+Rp 5.000)</span>
    </label>
  </div>

  <button onclick="checkout()">Hitung Total</button>

  <div id="hasil-box" style="margin-top: 20px; text-align: center;">
    <h3 id="hasil" style="color: #0063C6; margin: 0; font-size: 20px;"></h3>
  </div>
</div>

<script src="js/app.js"></script>
</body>
</html>
